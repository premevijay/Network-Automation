---
- name: IOS-XE Compliance Check
  hosts: cisco_iosxe
  gather_facts: false

  vars_files:
    - "../controls/lab_baseline.yml"

  tasks:

    # ---------------------------------------------------------
    # Initialize
    # ---------------------------------------------------------

    - name: Initialize compliance results list
      ansible.builtin.set_fact:
        compliance_results: []

    # ---------------------------------------------------------
    # Execute compliance controls
    # ---------------------------------------------------------

    - name: Evaluate hostname compliance
      ansible.builtin.include_tasks:
        file: "../tasks/hostname_check.yml"

    - name: Evaluate NTP compliance
      ansible.builtin.include_tasks:
        file: "../tasks/ntp_check.yml"

    # ---------------------------------------------------------
    # Calculate summary counters
    # ---------------------------------------------------------

    - name: Calculate compliance counters
      ansible.builtin.set_fact:
        passed_controls: >-
          {{
            compliance_results
            | selectattr('status', 'equalto', 'PASS')
            | list
            | length
          }}

        failed_controls: >-
          {{
            compliance_results
            | selectattr('status', 'equalto', 'FAIL')
            | list
            | length
          }}

    - name: Calculate compliance percentage
      ansible.builtin.set_fact:
        compliance_percentage: >-
          {{
            (
              (passed_controls | int) * 100.0 /
              ((passed_controls | int) + (failed_controls | int))
            ) | round(2)
            if ((passed_controls | int) + (failed_controls | int)) > 0
            else 0
          }}

    # ---------------------------------------------------------
    # Display each control separately
    # ---------------------------------------------------------

    - name: Display individual compliance results
      ansible.builtin.debug:
        msg:
          control_id: "{{ item.control_id }}"
          control_name: "{{ item.control_name }}"
          category: "{{ item.category }}"
          severity: "{{ item.severity }}"
          status: "{{ item.status }}"
          expected_state: "{{ item.expected_state }}"
          observed_state: "{{ item.observed_state }}"
          deviation: "{{ item.deviation }}"
          evidence: "{{ item.evidence }}"
          remediation_hint: "{{ item.remediation_hint }}"
      loop: "{{ compliance_results }}"
      loop_control:
        label: "{{ item.control_id }} - {{ item.control_name }}"

    # ---------------------------------------------------------
    # Build device summary
    # ---------------------------------------------------------

    - name: Build device compliance summary
      ansible.builtin.set_fact:
        device_summary:
          device: "{{ inventory_hostname }}"
          vendor: "Cisco"
          platform: "IOS-XE"

          controls_total: "{{ compliance_results | length }}"
          passed: "{{ passed_controls }}"
          failed: "{{ failed_controls }}"

          compliance_percentage: "{{ compliance_percentage }}"

    # ---------------------------------------------------------
    # Display device summary
    # ---------------------------------------------------------

    - name: Display device compliance summary
      ansible.builtin.debug:
        var: device_summary